name: Build Neutron Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Java Environment
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 3. Force Install Gradle 8.7 globally (Bypasses wrapper check)
    - name: Install Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    # 4. Run the build command using the installed Gradle
    - name: Build Mod
      run: gradle build

    # 5. Upload the compiled .jar file
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Neutron-Jar-File
        path: '**/build/libs/*.jar'
